<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HARVA — Forge Your Force | Workout Tracker</title>
    <style>
        body { margin: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #0b0b0b; color: #fff; }
        header { background-color: #111; border-bottom: 2px solid #222; padding: 15px 30px; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #fff; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; text-decoration: none; font-size: 1.4rem; }
        .logo span { color: #ff3e3e; font-weight: 400; }
        nav { display: flex; gap: 25px; align-items: center; }
        .nav-link { color: #aaa; text-decoration: none; font-size: 0.9rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; transition: color 0.2s; }
        .nav-link:hover { color: #fff; }
        .nav-btn { background-color: #ff3e3e; color: #fff; text-decoration: none; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; padding: 8px 18px; border-radius: 4px; transition: background 0.2s; }
        .nav-btn:hover { background-color: #d32f2f; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }
        .card { background-color: #111; border: 1px solid #222; padding: 25px; border-radius: 4px; margin-bottom: 20px; }
        .card h2 { text-transform: uppercase; font-size: 1.4rem; border-left: 3px solid #ff3e3e; padding-left: 10px; margin-top: 0; margin-bottom: 20px; }
        .btn-action { background-color: #ff3e3e; border: none; font-weight: 700; text-transform: uppercase; cursor: pointer; width: 100%; padding: 15px; color:#fff; border-radius:4px;}
        .btn-action:hover { background-color: #d32f2f; }
        .set-row { display: grid; grid-template-columns: 1fr 2fr 2fr 1fr; gap: 10px; margin-bottom: 10px; align-items: center; }
        input { padding: 10px; background-color: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 4px; text-align: center; }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">HARVA <span>// Forge Your Force</span></a>
            <nav>
                <a href="index.html" class="nav-link">Services</a>
                <a href="nutrition.html" class="nav-link">🥗 Nutrition Tracker</a>
                <a href="tracker.html" class="nav-link" style="color:#fff;">⚡ Workout Tracker</a>
                <a href="portal.html" class="nav-btn">🔒 Athlete Portal</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <div>
            <div class="card">
                <h2>Active Session Tracker</h2>
                <div style="font-size: 2.5rem; font-weight: 800; text-align: center; margin: 20px 0; font-variant-numeric: tabular-nums;">00:42:15</div>
                <div style="border-top: 1px solid #222; padding-top: 20px;">
                    <h3 style="text-transform:uppercase; margin-bottom:15px; color:#ff3e3e;">Exercise 1: Barbell Back Squat</h3>
                    <div class="set-row" style="font-weight:700; color:#aaa; font-size:0.8rem;"><div>SET</div><div>KG</div><div>REPS</div><div>DONE</div></div>
                    <div class="set-row"><div>1</div><input type="number" value="100"><input type="number" value="5"> <input type="checkbox" checked></div>
                    <div class="set-row"><div>2</div><input type="number" value="100"><input type="number" value="5"> <input type="checkbox" checked></div>
                    <div class="set-row"><div>3</div><input type="number" value="105"><input type="number" value="5"> <input type="checkbox"></div>
                </div>
                <button class="btn-action" style="margin-top:20px;">Finish & Log Session</button>
            </div>
        </div>

        <div>
            <div class="card">
                <h2>Live Metrics</h2>
                <p>Completed Sets: <strong>2</strong></p>
                <p>Total Volume: <strong>1,000 kg</strong></p>
            </div>
            <div class="card">
                <h2>Rest Timer</h2>
                <div style="font-size:1.8rem; text-align:center; color:#ff3e3e; font-weight:700; margin-bottom:10px;">01:15</div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px;"><button>+30s</button><button>Reset</button></div>
            </div>
        </div>
    </div>

</body>
</html>
